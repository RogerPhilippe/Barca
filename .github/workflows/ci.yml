name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx install-electron

      - name: Prepare Linux display and Chromium sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Protocol tests (FTP and SFTP)
        run: npm test

      - name: Interface test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a npm run test:smoke; else npm run test:smoke; fi

      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then npm run dist:linux; else npm run dist:win; fi

      - name: Launch packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist/Barca-linux-x64
          sudo chown root:root chrome-sandbox
          sudo chmod 4755 chrome-sandbox
          Xvfb :99 -screen 0 1400x900x24 &
          sleep 2
          export DISPLAY=:99
          ./barca > ../launch.log 2>&1 &
          PID=$!
          sleep 15
          if ! kill -0 $PID 2>/dev/null; then cat ../launch.log; exit 1; fi
          mkdir -p ../../test-output
          import -window root ../../test-output/packaged-linux.png
          kill $PID
          echo "packaged app was still running after 15 s"

      - name: Launch packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Barca-win32-x64\Barca.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "packaged app exited with code $($p.ExitCode)"; exit 1 }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          New-Item -ItemType Directory -Force -Path test-output | Out-Null
          $bmp.Save("test-output\packaged-windows.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id -Force
          Write-Output "packaged app was still running after 15 s"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.os }}
          path: test-output/
          if-no-files-found: warn
